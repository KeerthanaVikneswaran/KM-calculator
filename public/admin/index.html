<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - Bus KM System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid px-4">
        <span class="navbar-brand mb-0 h1">Transport Admin Dashboard</span>
        <div>
            <span class="text-white small me-3" id="whoami"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">

    <div class="row g-3 mb-4" id="summaryCards">
        <div class="col-md-2col col-6 col-md">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Employees</div>
                    <div class="fs-3 fw-bold" id="cardEmployees">--</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Buses Used</div>
                    <div class="fs-3 fw-bold" id="cardBuses">--</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Completed</div>
                    <div class="fs-3 fw-bold text-success" id="cardCompleted">--</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Pending</div>
                    <div class="fs-3 fw-bold text-warning" id="cardPending">--</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Total KM</div>
                    <div class="fs-3 fw-bold text-primary" id="cardKM">--</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h6 class="card-title mb-3">Add Employee</h6>
            <form id="addEmployeeForm">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small">Employee ID</label>
                        <input type="text" class="form-control form-control-sm" id="newEmployeeId" placeholder="e.g. EMP004" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Name</label>
                        <input type="text" class="form-control form-control-sm" id="newEmployeeName" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">IC Number</label>
                        <input type="text" class="form-control form-control-sm" id="newEmployeeIC">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Department</label>
                        <input type="text" class="form-control form-control-sm" id="newEmployeeDept">
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-success btn-sm w-100">Add</button>
                    </div>
                </div>
                <div id="addEmployeeMsg" class="alert d-none py-2 mt-2 mb-0"></div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Date</label>
                    <input type="date" class="form-control form-control-sm" id="filterDate">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Bus</label>
                    <select class="form-select form-select-sm" id="filterBus">
                        <option value="">All Buses</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Employee ID</label>
                    <input type="text" class="form-control form-control-sm" id="filterEmployee" placeholder="e.g. EMP001">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Status</label>
                    <select class="form-select form-select-sm" id="filterStatus">
                        <option value="">All</option>
                        <option value="Completed">Completed</option>
                        <option value="KM Pending">KM Pending</option>
                        <option value="Bus Pending">Bus Pending</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary btn-sm w-100" id="searchBtn">Search</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h6 class="card-title">Transactions</h6>
            <div class="table-responsive">
                <table class="table table-sm table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Employee ID</th><th>Name</th><th>Bus</th><th>Date</th><th>KM</th><th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/shared/api.js"></script>
<script>
const user = Auth.requireRole('admin');
document.getElementById('whoami').textContent = `${user.username} (${user.role})`;
document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

document.getElementById('filterDate').value = todayISO();

async function loadBusFilter() {
    const buses = await apiFetch('/api/buses');
    const select = document.getElementById('filterBus');
    buses.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.BusID;
        opt.textContent = b.BusNumber;
        select.appendChild(opt);
    });
}

async function loadSummary() {
    const date = document.getElementById('filterDate').value;
    const data = await apiFetch(`/api/dashboard?date=${date}`);
    document.getElementById('cardEmployees').textContent = data.TotalEmployees ?? 0;
    document.getElementById('cardBuses').textContent = data.TotalBuses ?? 0;
    document.getElementById('cardCompleted').textContent = data.Completed ?? 0;
    document.getElementById('cardPending').textContent = data.Pending ?? 0;
    document.getElementById('cardKM').textContent = Number(data.TotalKM ?? 0).toFixed(1);
}

async function loadResults() {
    const params = new URLSearchParams();
    const date = document.getElementById('filterDate').value;
    const busId = document.getElementById('filterBus').value;
    const employeeId = document.getElementById('filterEmployee').value.trim();
    const status = document.getElementById('filterStatus').value;

    if (date) params.set('date', date);
    if (busId) params.set('busId', busId);
    if (employeeId) params.set('employeeId', employeeId);
    if (status) params.set('status', status);

    const rows = await apiFetch(`/api/transactions?${params.toString()}`);
    const body = document.getElementById('resultsBody');
    body.innerHTML = rows.map(r => `
        <tr>
            <td>${r.EmployeeID}</td>
            <td>${r.EmployeeName}</td>
            <td>${r.BusNumber || '--'}</td>
            <td>${new Date(r.TravelDate).toISOString().slice(0,10)}</td>
            <td>${r.KM ?? '--'}</td>
            <td>${statusBadge(r.Status)}</td>
        </tr>
    `).join('') || '<tr><td colspan="6" class="text-muted text-center">No records found</td></tr>';
}

document.getElementById('searchBtn').addEventListener('click', () => {
    loadSummary();
    loadResults();
});

document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('addEmployeeMsg');
    msg.classList.add('d-none');

    const employeeId = document.getElementById('newEmployeeId').value.trim();
    const employeeName = document.getElementById('newEmployeeName').value.trim();
    const icNumber = document.getElementById('newEmployeeIC').value.trim();
    const department = document.getElementById('newEmployeeDept').value.trim();

    try {
        await apiFetch('/api/employees', {
            method: 'POST',
            body: JSON.stringify({ employeeId, employeeName, icNumber, department })
        });
        msg.className = 'alert alert-success py-2 mt-2 mb-0';
        msg.textContent = `Added employee ${employeeId}`;
        msg.classList.remove('d-none');
        document.getElementById('addEmployeeForm').reset();
    } catch (err) {
        msg.className = 'alert alert-danger py-2 mt-2 mb-0';
        msg.textContent = err.message;
        msg.classList.remove('d-none');
    }
});

loadBusFilter();
loadSummary();
loadResults();
</script>
</body>
</html>
