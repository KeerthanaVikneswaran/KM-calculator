<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portal 1 - Bus Employee Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #0b2545;
        --navy-2: #10335c;
        --accent: #2563eb;
        --accent-soft: #eaf1ff;
        --border: #e3e8ef;
        --muted: #64748b;
    }
    body {
        background: #f4f6f9;
        font-family: 'Inter', system-ui, sans-serif;
        color: #1e2937;
    }
    .gov-header {
        background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
        padding: 18px 0;
        border-bottom: 3px solid var(--accent);
    }
    .gov-header .brand-mark {
        width: 40px; height: 40px;
        background: var(--accent);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 1.1rem; color: #fff;
        flex-shrink: 0;
    }
    .gov-header .brand-title {
        color: #fff; font-weight: 700; font-size: 1.05rem; line-height: 1.2; margin: 0;
    }
    .gov-header .brand-subtitle {
        color: #b9c6dc; font-size: .75rem; letter-spacing: .04em; text-transform: uppercase;
    }
    .gov-header .badge-role {
        background: rgba(255,255,255,.12);
        color: #fff;
        border: 1px solid rgba(255,255,255,.25);
    }

    .page-wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }

    .panel {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        box-shadow: 0 1px 2px rgba(16,24,40,.04);
    }
    .panel-header {
        padding: 14px 20px; border-bottom: 1px solid var(--border);
    }
    .panel-header h6 { margin: 0; font-weight: 700; color: #101828; }
    .panel-body { padding: 20px; }

    .form-label { color: var(--muted); font-weight: 600; font-size: .85rem; }

    table.gov-table thead th {
        background: #f8fafc; color: var(--muted); font-size: .72rem;
        text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
        border-bottom: 1px solid var(--border);
    }
    table.gov-table td { font-size: .9rem; vertical-align: middle; }
    table.gov-table tbody tr:hover { background: var(--accent-soft); }

    .footer-note { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 24px; }
</style>
</head>
<body>

<header class="gov-header">
    <div class="page-wrap py-0 d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div class="d-flex align-items-center gap-3">
            <div class="brand-mark">P1</div>
            <div>
                <p class="brand-title">Portal 1 &mdash; Bus Employee Registration</p>
                <div class="brand-subtitle">Bus KM Management System</div>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge badge-role rounded-pill px-3 py-2" id="whoami"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</header>

<div class="page-wrap">
    <div class="panel mb-4">
        <div class="panel-header"><h6>Register Employee to Bus</h6></div>
        <div class="panel-body">
            <div class="mb-3">
                <label class="form-label">Bus Number</label>
                <select class="form-select" id="busSelect" required>
                    <option value="">Select Bus</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Employee ID (type or scan)</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="employeeSearch" list="employeeList" placeholder="Scan or type Employee ID, then Enter" autocomplete="off">
                    <button type="button" class="btn btn-primary" id="addBtn">Add</button>
                    <button type="button" class="btn btn-outline-primary" id="qrScanBtn">Scan QR</button>
                </div>
                <datalist id="employeeList"></datalist>
            </div>

            <div id="msgBox" class="alert d-none py-2 mb-0"></div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header"><h6>Today's Entries</h6></div>
        <div class="panel-body pt-2">
            <div class="table-responsive">
                <table class="table table-sm gov-table align-middle mb-0">
                    <thead>
                        <tr><th>Employee</th><th>Bus</th></tr>
                    </thead>
                    <tbody id="entriesBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <p class="footer-note">Bus KM Management System &mdash; Internal Use Only</p>
</div>

<!-- QR scanner modal -->
<div id="qrModal" class="d-none" style="position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1050;">
    <div class="d-flex flex-column align-items-center justify-content-center h-100 p-3">
        <video id="qrVideo" playsinline style="width:100%; max-width:420px; border-radius:8px;"></video>
        <div id="qrError" class="alert alert-danger py-2 mt-3 d-none"></div>
        <button type="button" class="btn btn-light mt-3" id="qrCancelBtn">Cancel</button>
    </div>
</div>
<canvas id="qrCanvas" class="d-none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/shared/api.js"></script>
<script>
const user = Auth.requireRole('admin', 'portal1');
document.getElementById('whoami').textContent = `${user.username} (${user.role})`;
document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

let employees = [];
const employeeInput = document.getElementById('employeeSearch');
const busSelect = document.getElementById('busSelect');
const msgBox = document.getElementById('msgBox');

async function loadBuses() {
    const buses = await apiFetch('/api/buses');
    buses.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.BusID;
        opt.textContent = b.BusNumber;
        busSelect.appendChild(opt);
    });
}

async function loadEmployees() {
    employees = await apiFetch('/api/employees');
    const list = document.getElementById('employeeList');
    list.innerHTML = '';
    employees.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.EmployeeID;
        list.appendChild(opt);
    });
}

let todayEntries = [];

async function loadTodayEntries() {
    todayEntries = await apiFetch(`/api/transactions?date=${todayISO()}`);
    renderEntries();
}

function renderEntries() {
    const body = document.getElementById('entriesBody');

    if (!busSelect.value) {
        body.innerHTML = '<tr><td colspan="2" class="text-muted text-center">Select a bus to see entries</td></tr>';
        return;
    }

    const rows = todayEntries.filter(r => String(r.BusID) === String(busSelect.value));
    body.innerHTML = rows.map(r => `
        <tr>
            <td>${r.EmployeeID}</td>
            <td>${r.BusNumber || '--'}</td>
        </tr>
    `).join('') || '<tr><td colspan="2" class="text-muted text-center">No entries yet</td></tr>';
}

busSelect.addEventListener('change', renderEntries);

let msgTimer = null;
function showMsg(type, text) {
    clearTimeout(msgTimer);
    msgBox.className = `alert alert-${type} py-2 mb-0`;
    msgBox.textContent = text;
    msgBox.classList.remove('d-none');
    msgTimer = setTimeout(() => msgBox.classList.add('d-none'), 2000);
}

async function submitScan() {
    const typed = employeeInput.value.trim();
    if (!typed) return;

    if (!busSelect.value) {
        showMsg('danger', 'Please select a bus first');
        employeeInput.value = '';
        busSelect.focus();
        return;
    }

    const id = typed.split(' - ')[0].trim();
    const match = employees.find(emp => emp.EmployeeID.toLowerCase() === id.toLowerCase()
        || emp.ICNumber === typed);

    if (!match) {
        showMsg('danger', `Employee "${typed}" not found`);
        employeeInput.value = '';
        employeeInput.focus();
        return;
    }

    if (todayEntries.some(r => r.EmployeeID === match.EmployeeID)) {
        showMsg('danger', `${match.EmployeeID} - ${match.EmployeeName} already registered today`);
        employeeInput.value = '';
        employeeInput.focus();
        return;
    }

    try {
        const data = await apiFetch('/api/bus-entry', {
            method: 'POST',
            body: JSON.stringify({
                employeeId: match.EmployeeID,
                busId: busSelect.value,
                travelDate: todayISO()
            })
        });
        showMsg('success', `Saved: ${data.transaction.EmployeeID} -> ${data.transaction.BusNumber}`);
        loadTodayEntries();
    } catch (err) {
        showMsg('danger', err.message);
    }

    employeeInput.value = '';
    employeeInput.focus();
}

employeeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        submitScan();
    }
});

document.getElementById('addBtn').addEventListener('click', submitScan);

/* ------------------------- QR camera scanner ------------------------- */
const qrModal = document.getElementById('qrModal');
const qrVideo = document.getElementById('qrVideo');
const qrCanvas = document.getElementById('qrCanvas');
const qrError = document.getElementById('qrError');
let qrStream = null;
let qrLoopId = null;

async function openQrScanner() {
    qrError.classList.add('d-none');
    qrModal.classList.remove('d-none');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        qrError.textContent = 'Camera needs a secure (https://) link. Open this page using the Railway https:// URL, not a plain http:// address.';
        qrError.classList.remove('d-none');
        return;
    }

    try {
        qrStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } }
        });
    } catch (err) {
        qrError.textContent = 'Could not access camera: ' + err.message;
        qrError.classList.remove('d-none');
        return;
    }

    qrVideo.srcObject = qrStream;
    qrVideo.setAttribute('playsinline', true);
    await qrVideo.play();

    const ctx = qrCanvas.getContext('2d');
    const tick = () => {
        if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
            qrCanvas.width = qrVideo.videoWidth;
            qrCanvas.height = qrVideo.videoHeight;
            ctx.drawImage(qrVideo, 0, 0, qrCanvas.width, qrCanvas.height);
            const imageData = ctx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code && code.data) {
                closeQrScanner();
                employeeInput.value = code.data.trim();
                submitScan();
                return;
            }
        }
        qrLoopId = requestAnimationFrame(tick);
    };
    qrLoopId = requestAnimationFrame(tick);
}

function closeQrScanner() {
    qrModal.classList.add('d-none');
    if (qrLoopId) cancelAnimationFrame(qrLoopId);
    qrLoopId = null;
    if (qrStream) {
        qrStream.getTracks().forEach(t => t.stop());
        qrStream = null;
    }
    qrVideo.srcObject = null;
}

document.getElementById('qrScanBtn').addEventListener('click', openQrScanner);
document.getElementById('qrCancelBtn').addEventListener('click', closeQrScanner);

loadBuses();
loadEmployees();
loadTodayEntries();
employeeInput.focus();
</script>
</body>
</html>
