<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portal 1 - Bus Employee Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Portal 1 &mdash; Bus Employee Registration</span>
        <div>
            <span class="text-white small me-3" id="whoami"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Register Employee to Bus</h5>
                    <div class="mb-3">
                        <label class="form-label">Bus Number</label>
                        <select class="form-select" id="busSelect" required>
                            <option value="">Select Bus</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Employee ID (type or scan)</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="employeeSearch" list="employeeList" placeholder="Scan or type Employee ID, then Enter" autocomplete="off">
                            <button type="button" class="btn btn-primary" id="addBtn">Add</button>
                            <button type="button" class="btn btn-outline-primary" id="qrScanBtn">Scan QR</button>
                        </div>
                        <datalist id="employeeList"></datalist>
                    </div>

                    <div id="msgBox" class="alert d-none py-2"></div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Today's Entries</h6>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr><th>Employee</th><th>Bus</th></tr>
                            </thead>
                            <tbody id="entriesBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- QR scanner modal -->
<div id="qrModal" class="d-none" style="position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1050;">
    <div class="d-flex flex-column align-items-center justify-content-center h-100 p-3">
        <video id="qrVideo" playsinline style="width:100%; max-width:420px; border-radius:8px;"></video>
        <div id="qrError" class="alert alert-danger py-2 mt-3 d-none"></div>
        <button type="button" class="btn btn-light mt-3" id="qrCancelBtn">Cancel</button>
    </div>
</div>
<canvas id="qrCanvas" class="d-none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/shared/api.js"></script>
<script>
const user = Auth.requireRole('admin', 'portal1');
document.getElementById('whoami').textContent = `${user.username} (${user.role})`;
document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

let employees = [];
const employeeInput = document.getElementById('employeeSearch');
const busSelect = document.getElementById('busSelect');
const msgBox = document.getElementById('msgBox');

async function loadBuses() {
    const buses = await apiFetch('/api/buses');
    buses.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.BusID;
        opt.textContent = b.BusNumber + (b.BusName ? ` - ${b.BusName}` : '');
        busSelect.appendChild(opt);
    });
}

async function loadEmployees() {
    employees = await apiFetch('/api/employees');
    const list = document.getElementById('employeeList');
    list.innerHTML = '';
    employees.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.EmployeeID;
        list.appendChild(opt);
    });
}

let todayEntries = [];

async function loadTodayEntries() {
    todayEntries = await apiFetch(`/api/transactions?date=${todayISO()}`);
    renderEntries();
}

function renderEntries() {
    const body = document.getElementById('entriesBody');

    if (!busSelect.value) {
        body.innerHTML = '<tr><td colspan="2" class="text-muted text-center">Select a bus to see entries</td></tr>';
        return;
    }

    const rows = todayEntries.filter(r => String(r.BusID) === String(busSelect.value));
    body.innerHTML = rows.map(r => `
        <tr>
            <td>${r.EmployeeID}</td>
            <td>${r.BusNumber || '--'}</td>
        </tr>
    `).join('') || '<tr><td colspan="2" class="text-muted text-center">No entries yet</td></tr>';
}

busSelect.addEventListener('change', renderEntries);

let msgTimer = null;
function showMsg(type, text) {
    clearTimeout(msgTimer);
    msgBox.className = `alert alert-${type} py-2`;
    msgBox.textContent = text;
    msgBox.classList.remove('d-none');
    msgTimer = setTimeout(() => msgBox.classList.add('d-none'), 2000);
}

async function submitScan() {
    const typed = employeeInput.value.trim();
    if (!typed) return;

    if (!busSelect.value) {
        showMsg('danger', 'Please select a bus first');
        employeeInput.value = '';
        busSelect.focus();
        return;
    }

    const id = typed.split(' - ')[0].trim();
    const match = employees.find(emp => emp.EmployeeID.toLowerCase() === id.toLowerCase()
        || emp.ICNumber === typed);

    if (!match) {
        showMsg('danger', `Employee "${typed}" not found`);
        employeeInput.value = '';
        employeeInput.focus();
        return;
    }

    if (todayEntries.some(r => r.EmployeeID === match.EmployeeID)) {
        showMsg('danger', `${match.EmployeeID} - ${match.EmployeeName} already registered today`);
        employeeInput.value = '';
        employeeInput.focus();
        return;
    }

    try {
        const data = await apiFetch('/api/bus-entry', {
            method: 'POST',
            body: JSON.stringify({
                employeeId: match.EmployeeID,
                busId: busSelect.value,
                travelDate: todayISO()
            })
        });
        showMsg('success', `Saved: ${data.transaction.EmployeeID} -> ${data.transaction.BusNumber}`);
        loadTodayEntries();
    } catch (err) {
        showMsg('danger', err.message);
    }

    employeeInput.value = '';
    employeeInput.focus();
}

employeeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        submitScan();
    }
});

document.getElementById('addBtn').addEventListener('click', submitScan);

/* ------------------------- QR camera scanner ------------------------- */
const qrModal = document.getElementById('qrModal');
const qrVideo = document.getElementById('qrVideo');
const qrCanvas = document.getElementById('qrCanvas');
const qrError = document.getElementById('qrError');
let qrStream = null;
let qrLoopId = null;

async function openQrScanner() {
    qrError.classList.add('d-none');
    qrModal.classList.remove('d-none');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        qrError.textContent = 'Camera needs a secure (https://) link. Open this page using the Railway https:// URL, not a plain http:// address.';
        qrError.classList.remove('d-none');
        return;
    }

    try {
        qrStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } }
        });
    } catch (err) {
        qrError.textContent = 'Could not access camera: ' + err.message;
        qrError.classList.remove('d-none');
        return;
    }

    qrVideo.srcObject = qrStream;
    qrVideo.setAttribute('playsinline', true);
    await qrVideo.play();

    const ctx = qrCanvas.getContext('2d');
    const tick = () => {
        if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
            qrCanvas.width = qrVideo.videoWidth;
            qrCanvas.height = qrVideo.videoHeight;
            ctx.drawImage(qrVideo, 0, 0, qrCanvas.width, qrCanvas.height);
            const imageData = ctx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code && code.data) {
                closeQrScanner();
                employeeInput.value = code.data.trim();
                submitScan();
                return;
            }
        }
        qrLoopId = requestAnimationFrame(tick);
    };
    qrLoopId = requestAnimationFrame(tick);
}

function closeQrScanner() {
    qrModal.classList.add('d-none');
    if (qrLoopId) cancelAnimationFrame(qrLoopId);
    qrLoopId = null;
    if (qrStream) {
        qrStream.getTracks().forEach(t => t.stop());
        qrStream = null;
    }
    qrVideo.srcObject = null;
}

document.getElementById('qrScanBtn').addEventListener('click', openQrScanner);
document.getElementById('qrCancelBtn').addEventListener('click', closeQrScanner);

loadBuses();
loadEmployees();
loadTodayEntries();
employeeInput.focus();
</script>
</body>
</html>
