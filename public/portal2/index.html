<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portal 2 - KM Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { overflow-x: hidden; }
    .navbar-brand { font-size: 1.1rem; }
    @media (max-width: 480px) {
        .navbar-brand { font-size: .95rem; }
    }
    table { min-width: 320px; }
    .km-edit-group { flex-wrap: wrap; }
    .km-edit-group > input { flex: 1 1 100%; border-radius: .375rem .375rem 0 0 !important; }
    .km-edit-group > .btn { flex: 1 1 auto; border-radius: 0 !important; }
    .km-edit-group > .btn:last-child { border-radius: 0 0 .375rem .375rem !important; }
</style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success mb-4">
    <div class="container flex-wrap gap-2">
        <span class="navbar-brand mb-0">Portal 2 &mdash; KM Entry</span>
        <div class="d-flex align-items-center">
            <span class="text-white small me-3" id="whoami"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Select Bus</h5>
                    <select class="form-select" id="busSelect" required>
                        <option value="">Select Bus</option>
                    </select>
                </div>
            </div>

            <div id="msgBox" class="alert d-none py-2"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h6 class="card-title mb-0">Employees on this Bus (tap to enter KM)</h6>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshBtn">Refresh</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr><th>Employee</th><th>KM / Status</th></tr>
                            </thead>
                            <tbody id="entriesBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/shared/api.js"></script>
<script>
const user = Auth.requireRole('admin', 'portal2');
document.getElementById('whoami').textContent = user.username;
document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

const busSelect = document.getElementById('busSelect');
const msgBox = document.getElementById('msgBox');
let currentRows = [];
let editingId = null;

async function loadBuses() {
    const buses = await apiFetch('/api/buses');
    buses.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.BusID;
        opt.textContent = b.BusNumber;
        busSelect.appendChild(opt);
    });
}

let msgTimer = null;
function showMsg(type, text) {
    clearTimeout(msgTimer);
    msgBox.className = `alert alert-${type} py-2`;
    msgBox.textContent = text;
    msgBox.classList.remove('d-none');
    msgTimer = setTimeout(() => msgBox.classList.add('d-none'), 2000);
}

async function loadEmployeesForBus() {
    editingId = null;
    if (!busSelect.value) {
        currentRows = [];
        renderRows();
        return;
    }
    currentRows = await apiFetch(`/api/transactions?busId=${busSelect.value}&date=${todayISO()}`);
    renderRows();
}

function renderRows() {
    const body = document.getElementById('entriesBody');

    if (!busSelect.value) {
        body.innerHTML = '<tr><td colspan="2" class="text-muted text-center">Select a bus first</td></tr>';
        return;
    }
    if (!currentRows.length) {
        body.innerHTML = '<tr><td colspan="2" class="text-muted text-center">No employees scanned for this bus yet</td></tr>';
        return;
    }

    body.innerHTML = currentRows.map(r => {
        if (editingId === r.EmployeeID) {
            return `
                <tr>
                    <td>${r.EmployeeID}</td>
                    <td>
                        <div class="input-group input-group-sm km-edit-group">
                            <input type="number" step="0.1" min="0" class="form-control" id="kmInput" value="${r.KM ?? ''}" placeholder="KM">
                            <button class="btn btn-success" id="kmSaveBtn">Save</button>
                            <button class="btn btn-outline-secondary" id="kmCancelBtn">Cancel</button>
                        </div>
                    </td>
                </tr>`;
        }
        return `
            <tr class="km-row" data-id="${r.EmployeeID}" style="cursor:pointer">
                <td>${r.EmployeeID}</td>
                <td>${r.KM ?? '--'} ${statusBadge(r.Status)}</td>
            </tr>`;
    }).join('');

    if (editingId) {
        const kmInput = document.getElementById('kmInput');
        kmInput.focus();
        kmInput.select();
        document.getElementById('kmSaveBtn').addEventListener('click', saveKm);
        document.getElementById('kmCancelBtn').addEventListener('click', () => { editingId = null; renderRows(); });
        kmInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); saveKm(); }
            if (e.key === 'Escape') { editingId = null; renderRows(); }
        });
    } else {
        document.querySelectorAll('.km-row').forEach(tr => {
            tr.addEventListener('click', () => { editingId = tr.dataset.id; renderRows(); });
        });
    }
}

async function saveKm() {
    const employeeId = editingId;
    const km = document.getElementById('kmInput').value;
    msgBox.classList.add('d-none');

    try {
        const data = await apiFetch('/api/km-entry', {
            method: 'POST',
            body: JSON.stringify({ employeeId, travelDate: todayISO(), km })
        });
        showMsg('success', `Saved: ${data.transaction.EmployeeID} -> ${data.transaction.KM} KM (${data.transaction.Status})`);
        await loadEmployeesForBus();
    } catch (err) {
        showMsg('danger', err.message);
    }
}

busSelect.addEventListener('change', loadEmployeesForBus);

document.getElementById('refreshBtn').addEventListener('click', loadEmployeesForBus);

setInterval(() => {
    if (busSelect.value && editingId === null) loadEmployeesForBus();
}, 10000);

loadBuses();
renderRows();
</script>
</body>
</html>
