<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bus KM System - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background: #f1f4f8; height: 100vh; display: flex; align-items: center; }
    .login-card { max-width: 380px; width: 100%; margin: auto; }
</style>
</head>
<body>
<div class="login-card">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="text-center mb-1">Bus KM System</h4>
            <p class="text-center text-muted small mb-4">Sign in to continue</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div id="errorBox" class="alert alert-danger py-2 d-none"></div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>
</div>

<script src="/shared/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.add('d-none');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
        const data = await apiFetch('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username, password })
        });
        Auth.save(data.token, data.user);

        if (data.user.role === 'admin') window.location.href = '/admin';
        else if (data.user.role === 'portal1') window.location.href = '/portal1';
        else if (data.user.role === 'portal2') window.location.href = '/portal2';
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
    }
});
</script>
</body>
</html>
